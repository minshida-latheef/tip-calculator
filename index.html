<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <div class="calculator-card">

            <h1>Tip Calculator</h1>
            <p class="subtitle">Calculate your tip and split the bill</p>

            <!-- Bill Amount -->
            <div class="input-group">
                <label for="bill">Bill Amount</label>

                <div class="input-box">
                    <span>₹</span>
                    <input
                        type="number"
                        id="bill"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                    >
                </div>
            </div>

            <!-- Tip Percentage -->
            <div class="input-group">
                <label for="tip">Tip Percentage</label>

                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="5">5%</button>
                    <button type="button" class="tip-btn" data-tip="10">10%</button>
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                </div>

                <div class="input-box">
                    <input
                        type="number"
                        id="tip"
                        placeholder="Enter tip %"
                        min="0"
                        step="0.1"
                    >
                    <span>%</span>
                </div>
            </div>

            <!-- Number of People -->
            <div class="input-group">
                <label for="people">Number of People</label>

                <div class="input-box">
                    <input
                        type="number"
                        id="people"
                        value="1"
                        min="1"
                        step="1"
                    >
                    <span>👤</span>
                </div>
            </div>

            <!-- Error Message -->
            <p id="error-message" class="error-message"></p>

            <!-- Buttons -->
            <div class="action-buttons">
                <button id="calculate-btn" class="calculate-btn">
                    Calculate
                </button>

                <button id="reset-btn" class="reset-btn">
                    Reset
                </button>
            </div>

            <!-- Results -->
            <div class="result-card">

                <div class="result-row">
                    <span>Tip Amount</span>
                    <strong>₹<span id="tip-result">0.00</span></strong>
                </div>

                <div class="result-row">
                    <span>Total Amount</span>
                    <strong>₹<span id="total-result">0.00</span></strong>
                </div>

                <div class="result-row highlight">
                    <span>Per Person</span>
                    <strong>₹<span id="person-result">0.00</span></strong>
                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
